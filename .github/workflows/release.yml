name: Android Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.0.12077973"
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/t3code-native-release.jks"
      - name: Build signed release APK
        env:
          T3_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/t3code-native-release.jks
          T3_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          T3_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          T3_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :protocol:test :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Prepare release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk "t3code-native-android-${GITHUB_REF_NAME}.apk"
          sha256sum "t3code-native-android-${GITHUB_REF_NAME}.apk" > "t3code-native-android-${GITHUB_REF_NAME}.apk.sha256"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "t3code-native-android-${GITHUB_REF_NAME}.apk" "t3code-native-android-${GITHUB_REF_NAME}.apk.sha256" --generate-notes --title "T3 Code Native ${GITHUB_REF_NAME}"
